appId: com.b0t0001.deepworktracker
productName: Deep Work Tracker
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # Working material, not the app. Without these the installer carries every
  # internal document and test harness in the repo - CLAUDE.md alone is 57KB
  # of reasoning aimed at whoever is editing the code, `notes/` is one session
  # arguing with another, and `scripts/` is seven harnesses that only run
  # against a checkout. None of it is read at runtime, all of it is in git,
  # and a doc-only commit should not change what ships.
  - '!{notes,scripts}/**'
  - '!{AGENTS.md,CLAUDE.md,PROJECT_PLAN.md}'
  - '!SPEC-*.md'
asarUnpack:
  - resources/**
win:
  executableName: deep-work-tracker
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createStartMenuShortcut: true
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
